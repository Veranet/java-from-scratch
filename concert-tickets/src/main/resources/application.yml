conditional:
  string: "thisIsMyFirstConditionalBean"
  string-enabled: false

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/my_ticket_service_db
    username: myuser
    password: mypassword

  jpa:
    properties:
      hibernate:
        ddl-auto: validate
    show-sql: true

  flyway:
    clean-on-validation-error: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 0

service:
  update-enabled: true